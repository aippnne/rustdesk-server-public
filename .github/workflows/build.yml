# RustDesk Server 公开版镜像自动构建
# 当前推送 Docker Hub；如需加阿里云 ACR，见下方注释
name: build

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      version_tag:
        description: '额外推送的版本标签（如 v1.1.16），留空则只推 latest'
        required: false
        default: ''

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    # 防止连续 push 时并发重复构建，串行执行
    concurrency:
      group: build-and-push
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ---- 登录 Docker Hub ----
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ---- 构建并推送 Docker Hub ----
      # 注：如需同时推送阿里云 ACR，配置 ALIYUN_REGISTRY/NAMESPACE/USERNAME/PASSWORD
      #     四个 Secrets 后，在此追加一个 aliyun login 步骤，并在 tags 下增加第二个仓库地址
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/rustdesk-server-s6-public:latest
            ${{ inputs.version_tag != '' && format('{0}/rustdesk-server-s6-public:{1}', secrets.DOCKERHUB_USERNAME, inputs.version_tag) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
