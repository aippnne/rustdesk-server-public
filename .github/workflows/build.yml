# RustDesk Server 公开版镜像自动构建
# 当前推送 Docker Hub；如需加阿里云 ACR，见下方注释
name: build

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ---- 登录 Docker Hub ----
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ---- 构建并推送 Docker Hub ----
      # 注：如需同时推送阿里云 ACR，配置 ALIYUN_REGISTRY/NAMESPACE/USERNAME/PASSWORD
      #     四个 Secrets 后，在此追加一个 aliyun login 步骤，并在 tags 下增加第二个仓库地址
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/rustdesk-server-s6-public:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
