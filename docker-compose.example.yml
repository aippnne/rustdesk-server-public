# ============================================================
# RustDesk Server 公开版镜像部署示例（生产版结构：RustDesk + Nginx 加速）
# 使用：docker compose -f docker-compose.example.yml up -d
# 部署前：
#   1) 把下面所有 你的公网IP 替换成真实值
#   2) 把 RUSTDESK_API_JWT_KEY 替换成随机值（openssl rand -hex 32）
#   3) 把仓库内 nginx.conf.example 复制到 /root/rustdesk/nginx.conf
# ============================================================
version: '3.8'

services:
  # ---- RustDesk 主服务（host 网络，复用宿主机网络栈）----
  rustdesk:
    network_mode: host
    image: aippme/rustdesk-server-s6-public:latest
    environment:
      # ---- 基础网络配置（改IP只需改这里）----
      - RELAY=你的公网IP:21117                             # 中继服务器地址
      - RUSTDESK_API_RUSTDESK_ID_SERVER=你的公网IP:21116   # ID服务器地址
      - RUSTDESK_API_RUSTDESK_RELAY_SERVER=你的公网IP:21117 # 中继服务器地址
      - RUSTDESK_API_RUSTDESK_API_SERVER=http://你的公网IP:21114 # API地址（对外21114，由nginx接管）
      # ---- 安全配置 ----
      - ENCRYPTED_ONLY=1                                    # 强制加密（客户端需配公钥）
      - MUST_LOGIN=N                                        # 是否强制登录
      - RUSTDESK_API_KEY_FILE=/data/id_ed25519.pub         # 公钥文件路径
      # ---- 限流与自定义 ----
      - LIMIT_SPEED=100                                     # 中继限速(KB/s)
      - RUSTDESK_API_APP_BAN_THRESHOLD=3                    # 登录失败封禁阈值
      - RUSTDESK_API_ADMIN_TITLE=RS SERVER                  # 管理后台标题
      # ---- 系统配置 ----
      - TZ=Asia/Shanghai                                    # 时区
      - RUSTDESK_API_JWT_KEY=请替换成随机64位hex            # JWT密钥（openssl rand -hex 32）
      # ---- webclient2 加速关键：apimain 监听内部端口 21140 ----
      # 21114 已让给 web-nginx 容器对外服务，不要改回 21114
      - RUSTDESK_API_GIN_API_ADDR=0.0.0.0:21140
    volumes:
      - /root/rustdesk/server:/data                             # RustDesk 数据持久化
      - /root/rustdesk/api:/app/data                            # API 数据
      - /root/rustdesk/config.yaml:/app/conf/config.yaml:ro    # 自定义config（含 api-addr=21140）
      # 可选：镜像内置了定制前端，如需外挂自己的前端产物可加下面这行
      # - /root/rustdesk/admin-web:/app/resources/admin:ro
    restart: unless-stopped
    cap_add:
      - NET_ADMIN                                               # host网络管理权限

  # ============================================================
  # Nginx 反代容器（webclient2 加载加速）
  # 功能：gzip压缩 + 静态资源30天缓存 + 反代 apimain(21140)
  # 配置：/root/rustdesk/nginx.conf（复制自仓库 nginx.conf.example，修改后 restart 生效）
  # ============================================================
  web-nginx:
    network_mode: host
    image: nginx:alpine
    volumes:
      - /root/rustdesk/nginx.conf:/etc/nginx/nginx.conf:ro      # nginx配置只读挂载
    restart: unless-stopped
    depends_on:
      - rustdesk                                                # 先起rustdesk再起nginx
